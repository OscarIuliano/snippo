name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Widget sotto i 30 KB gzip
        run: |
          size=$(gzip -c apps/widgets/chat/dist/v1/snippo.js | wc -c)
          echo "snippo.js: $size byte gzip"
          test "$size" -le 30720

  deploy-staging:
    # Every green push to main goes to staging on workers.dev.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Credenziali Cloudflare presenti?
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy di staging saltato: mancano i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm deploy:staging
