name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Widget sotto i 30 KB gzip
        run: |
          size=$(gzip -c apps/widgets/chat/dist/snippo.js | wc -c)
          echo "snippo.js: $size byte gzip"
          test "$size" -le 30720
