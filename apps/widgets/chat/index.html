<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snippo · pagina di prova</title>
  </head>
  <body style="font-family: system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px">
    <h1>Trattoria Demo</h1>
    <p>Pagina di prova: il widget usa l'API locale (<code>wrangler dev</code> su :8787) e il widget demo del seed.</p>
    <button onclick="window.Snippo && Snippo.open()">Prenota un tavolo</button>
    <script>
      // ?key=pk_... tests a widget created in the dashboard; without it, the seed demo widget.
      const script = document.createElement("script");
      script.type = "module";
      script.src = "/src/main.tsx";
      script.dataset.key = new URLSearchParams(location.search).get("key") ?? "pk_dev_snippo";
      script.dataset.api = "http://localhost:8787";
      document.body.appendChild(script);
    </script>
  </body>
</html>
